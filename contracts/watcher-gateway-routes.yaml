# watcher 网关路由唯一真源（machine-readable single source of truth）
#
# 设计真相：docs/plans/2026-09-11-watcher-to-app-migration.md v0.6 §2.1–§2.3、§3
# （含附录 E：v0.3 review P1-12..P1-19、P2-03）。本文件与计划冲突时以计划为准并召回 Architect；
# 与 contracts/backend-api.md §9 冲突时：路由字段（method/path/identity/roles/query/body/response/phase/budget/write）
# 以本文件为准，语义（错误码、状态机、事务顺序）以 backend-api.md §9 为准。
# 生成物（网关路由表、watcher 身份路由表、Caddy 路径清单）只能由本文件生成，禁止手写第二份矩阵。
# 校验规格见 contracts/backend-api.md §9.14。运行时不解析本文件（R9）：watcher 与控制面只加载 §9.14.3 的已提交生成物。
# 勘误：WGW-1.0.1（2026-09-26）改动见 backend-api.md §9.16。

schema_version: watcher-gateway-routes.v1
contract_version: WGW-1.0.1
frozen_at: "2026-09-26"
amended_at: "2026-09-26"          # WGW-1.0.1 勘误日期（backend-api.md §9.16）
source_plan: "docs/plans/2026-09-11-watcher-to-app-migration.md@v0.6"

# ---------------------------------------------------------------------------
# 路径前缀
# ---------------------------------------------------------------------------
paths:
  # app 请求 = trading.config.v1 的 baseUrl（已以 /m 结尾）+ outer_path；app 代码常量里不得出现 /m（§2.1 P1-18）
  app_outer_prefix: /v1/watcher
  # Caddy 外部路径 = caddy_external_prefix + outer_path；Caddy 只 strip 一次 /m，按本文件逐路径追加，禁止 /m/v1/* 通配
  caddy_external_prefix: /m
  # operator-query 访问 watcher 的固定上游（宿主 127.0.0.1:9090 → 容器 9100）；host 不可由请求改变，不跟随重定向
  watcher_upstream_default: "http://127.0.0.1:9090"

# ---------------------------------------------------------------------------
# 角色（require_reader 只会返回这四个；read_api.py:104-109，security/session_auth.py:13）
# ---------------------------------------------------------------------------
roles:
  all_readers: [system_observer, viewer, risk_admin, reviewer]
  writer: [risk_admin]

# ---------------------------------------------------------------------------
# 三种服务端身份（watcher 只认这三种；每个请求在所有 handler 与静态文件之前校验）
# ---------------------------------------------------------------------------
identities:
  gateway:
    holder: operator-query watcher 网关
    presented_as: "Authorization: Bearer <WATCHER_GATEWAY_TOKEN>"
    watcher_env: [WATCHER_GATEWAY_TOKEN, WATCHER_GATEWAY_TOKEN_PREVIOUS]
    requires_actor_headers: true
    actor: "app:<role>"
  snapshot:
    holder: operator-query 快照 reader（独立 client 与槽）
    presented_as: "Authorization: Bearer <WATCHER_SNAPSHOT_TOKEN>"
    watcher_env: [WATCHER_SNAPSHOT_TOKEN, WATCHER_SNAPSHOT_TOKEN_PREVIOUS]
    requires_actor_headers: false
    actor: null
  browser:
    holder: Caddy（basicauth 通过后，先清除全部外来 X-Watcher-* 再注入）
    presented_as: "X-Watcher-Proxy-Auth: <WATCHER_BROWSER_PROXY_TOKEN>"
    watcher_env: [WATCHER_BROWSER_PROXY_TOKEN, WATCHER_BROWSER_PROXY_TOKEN_PREVIOUS]
    requires_actor_headers: false
    actor: browser

# 网关注入、watcher 仅在 gateway 身份下接受的头（恰好各一条；缺或多 → 400 invalid_actor_headers）
actor_headers:
  actor: X-Watcher-Actor
  actor_pattern: '^app:(system_observer|viewer|risk_admin|reviewer)$'
  fingerprint: X-Watcher-Token-Fingerprint
  fingerprint_pattern: '^[0-9a-f]{12}$'

# ---------------------------------------------------------------------------
# 正则方言（R5）：本文件所有 *_pattern 与 secret_key_pattern.pattern 必须同时在 Python re 与 ECMAScript（u 标志）下同义。
# ---------------------------------------------------------------------------
regex_dialect:
  # 标志不写进 pattern（禁止 (?i) 等内联标志，JS 会 SyntaxError），只放在 secret_key_pattern.flags
  allowed_flags: [i]
  python:
    anchored: "re.fullmatch(pattern, value, flags)；禁止 re.match/re.search 配 $（Python 的 $ 可匹配结尾换行前）"
    search: "re.search(pattern, key, flags)（仅 secret_key_pattern）"
    flag_map: {i: re.IGNORECASE}
  javascript:
    anchored: "new RegExp(pattern, 'u' + flags).test(value)；u 恒加（码点计数与 Python 一致）"
    search: "new RegExp(pattern, 'u' + flags).test(key)（仅 secret_key_pattern）"
    forbidden_flags: [g, y, m, s]         # g/y 有 lastIndex 状态；m/s 改变 ^ $ . 语义
  # 可移植子集：禁止下列构造（S-20 检查）
  forbidden_constructs:
    - "(?        内联标志、命名组、前后瞻（(?: 非捕获组除外）"
    - "\\d \\w \\s \\b \\D \\W \\S \\B（Python str 模式下匹配 Unicode，JS 只匹配 ASCII；一律写显式字符类）"
    - "字符类之外未转义的 .（两边对行终止符的定义不同）"
  # 先类型后正则：pattern 只作用于已确认为 string 的值（JS RegExp.test 会把数字转成字符串）
  applies_to: string_only

# ---------------------------------------------------------------------------
# 秘密字段：gateway 行 body.deny 必须包含全部 secret_fields；gateway 行 allow/query 不得命中 secret_key_pattern；
# gateway 响应递归删除命中 secret_key_pattern 的键（不是掩码，是删除），错误体的整个 details 同样处理（R8）。
# ---------------------------------------------------------------------------
secret_fields:
  - api_key
  - api_secret
  - apiKey
  - apiSecret
  - api_id
  - api_hash
  - apiId
  - apiHash
  - session
  - sessionString
  - password
  - phoneNumber
  - phone
  - code
  - token
# safe-log.js:1 的 SENSITIVE_KEY_PATTERN 的超集（另含 api_id / phone）。未锚定，按"键名包含"判定（search 语义）；
# 误伤只会多拒/多删（安全方向），例如 rapid_* 会命中 api[_-]?id（§9.15 执行期注意事项）。
# WGW-1.0.1（R5）：由单个字符串改为 {pattern, flags}，去掉只在 Python 生效的 (?i)。
secret_key_pattern:
  pattern: '(api[_-]?key|api[_-]?secret|apisecret|api[_-]?hash|api[_-]?id|token|session|password|phone)'
  flags: i

# ---------------------------------------------------------------------------
# 预算（三份互不挤占；每 operator-query worker 计；舰队在途上限 = (config+media) × worker 数）
# ---------------------------------------------------------------------------
budgets:
  config:
    slots_per_worker: 4
    env: WATCHER_GATEWAY_CONFIG_SLOTS
    timeouts_s: {connect: 1.0, read: 6.0, write: 2.0, pool: 0.5, total: 8.0}
    max_request_body_bytes: 65536
    max_response_body_bytes: 8388608
  media:
    slots_per_worker: 4
    env: WATCHER_GATEWAY_MEDIA_SLOTS
    timeouts_s: {connect: 1.0, read: 10.0, write: 10.0, pool: 0.5, total: 60.0}
    max_file_bytes: 20971520
    max_chunk_bytes: 65536
  snapshot:
    slots_per_worker: 1
    env: null
    timeouts_s: {connect: 1.0, read: 2.0, write: 1.0, pool: 0.5, total: 2.0}
    max_response_body_bytes: 4194304

# ---------------------------------------------------------------------------
# 路径参数（gateway 按 raw_path 匹配；raw_path 含 '%'、'//'、尾斜杠、大小写不符 → 404 route_not_found）
# ---------------------------------------------------------------------------
path_params:
  account_id:
    gateway_pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{0,127}$'
    browser_pattern: '^[^\u0000-\u001F\u007F]{1,128}$'   # trading-api.js:12 CREDENTIAL_ACCOUNT_ID_PATTERN（Express 解码一次）
  channel_id:
    gateway_pattern: '^-?[0-9]{1,24}$'                     # telegram-utils.js:54-70 chatIdFromPeerId
    browser_pattern: '^-?[0-9]{1,24}$'
  symbol:
    gateway_pattern: '^[A-Z0-9]{2,32}$'
    browser_pattern: '^[A-Za-z0-9]{1,32}$'
  filename:
    gateway_pattern: '^[0-9]{10,16}-[0-9]{1,20}\.(jpg|jpeg|png|gif|webp)$'   # server.js:249-251 命名；仅图片
    browser_pattern: '^[0-9]{10,16}-[0-9]{1,20}\.[A-Za-z0-9.+-]{1,127}$'
  alert_id:
    gateway_pattern: '^[1-9][0-9]{0,18}$'
    browser_pattern: '^[1-9][0-9]{0,18}$'
  order_id:
    gateway_pattern: null                                  # 不对 gateway 开放
    browser_pattern: '^[1-9][0-9]{0,18}$'

# ---------------------------------------------------------------------------
# query 参数定义（未列出的键 → 400 invalid_query；同键重复 → 400 invalid_query）
# ---------------------------------------------------------------------------
query_params:
  channel: {type: string, pattern: '^-?[0-9]{1,24}$'}
  hours: {type: integer, min: 1, max: 168}          # 缺省 24（trading-api.js:888、:906 现状）
  limit: {type: integer, min: 1, max: 500}          # 缺省：trading/messages 与 briefings 为 500；/api/messages 为 100（server.js:836）
  before_created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$', requires: before_id}
  before_id: {type: integer, min: 1, requires: before_created_at}
  status: {type: string, pattern: '^[A-Z_]{1,32}$'}
  triggered: {type: string, enum: ["true", "false"]}
  source: {type: string, enum: [watcher, v3]}
  account_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
  environment: {type: string, enum: [mainnet, testnet]}
  position_ref: {type: string, max_length: 128}

# ---------------------------------------------------------------------------
# body 字段定义（gateway 做结构/类型校验；业务规则在 watcher。gateway 数字必须是 JSON number，布尔必须是 JSON boolean）
# ---------------------------------------------------------------------------
body_fields:
  client_ref: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
  expected_revision: {type: integer, min: 0}
  is_enabled: {type: boolean}
  account_type: {type: string, enum: [main, subaccount]}
  parent_account_id: {type: string, max_length: 128}
  execution_account_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}   # trading-api.js:13
  default_risk_ratio: {type: number, exclusive_min: 0, max: 0.1}
  risk_capital_addon: {type: number, min: 0}
  channel_id: {type: string, pattern: '^-?[0-9]{1,24}$'}
  target_account_id: {type: string, min_length: 1, max_length: 128}
  channel_name: {type: string, max_length: 128}
  symbol: {type: string, pattern: '^[A-Z0-9]{2,32}$'}
  risk_ratio: {type: number, exclusive_min: 0, max: 0.1}
  groups: {type: array, items: channel_id, max_items: 500, unique: true}
  source: {type: string, enum: [watcher, v3], gateway_enum: [v3]}
  account_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
  # v3：<symbol>:<position_side>:<account_id>；watcher：站点 active_orders.id
  position_ref: {type: string, pattern: '^([A-Z0-9]{2,32}:(LONG|SHORT|BOTH):[A-Za-z0-9][A-Za-z0-9._-]{0,63}|[1-9][0-9]{0,18})$', gateway_pattern: '^[A-Z0-9]{2,32}:(LONG|SHORT|BOTH):[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
  environment: {type: string, enum: [mainnet, testnet]}
  target_price: {type: number, exclusive_min: 0}
  direction: {type: string, enum: [above, below]}
  note: {type: string, max_length: 200}
  # ---- 仅 browser 行出现的字段（沿用站点现有宽松归一化：trading-api.js:1010-1099）----
  account_id_credential: {type: string, pattern: '^[^\u0000-\u001F\u007F]{1,128}$', browser_only: true}
  api_key: {type: string, secret: true, browser_only: true}
  api_secret: {type: string, secret: true, browser_only: true}
  is_testnet: {type: boolean_like, browser_only: true}
  risk_capital_multiplier: {type: number_like, browser_only: true}
  order_id: {type: integer_like, browser_only: true}
  alert_type: {type: string, browser_only: true}
  quantity: {type: number_like, browser_only: true}
  apiId: {type: string_or_integer, secret: true, browser_only: true}
  apiHash: {type: string, secret: true, browser_only: true}
  phoneNumber: {type: string, secret: true, browser_only: true}
  code: {type: string, secret: true, browser_only: true}
  password: {type: string, secret: true, browser_only: true}

# ---------------------------------------------------------------------------
# 响应头白名单（gateway 只回传这些；其余一律丢弃，并移除 Connection 声明的逐跳头）
# ---------------------------------------------------------------------------
response_headers:
  json: [Content-Type, Cache-Control]
  json_config_read: [Content-Type, Cache-Control, X-Config-Revision]
  # static 只用于 browser 行（无网关过滤，watcher 自身输出，列出以便生成物完整）
  static: [Content-Type, Content-Length, Cache-Control, ETag, Last-Modified]
  media: [Content-Range, Accept-Ranges, Content-Length, Content-Type, ETag, Last-Modified, Cache-Control]
media_request_headers: [Range, If-Range]

# ---------------------------------------------------------------------------
# 全局不变式（校验脚本逐条检查，见 backend-api.md §9.14）
# ---------------------------------------------------------------------------
invariants:
  - "gateway 写行（method ∈ POST/PUT/DELETE）roles 恰为 [risk_admin]；gateway 读行 roles 恰为四角色"
  - "gateway 行 body.deny ⊇ secret_fields；body.allow 与 query 不命中 secret_key_pattern"
  - "snapshot 身份只有 GET /api/trading/config-snapshot 一行；该行不出现在 gateway 身份（不向 app 暴露 snapshot）"
  - "HEAD 只在显式列出的行允许（仅媒体）；其余已注册路径的 HEAD/OPTIONS → 405"
  - "所有 gateway 写行响应带 revision 与 replay"
  - "never_allowed 中的 inner_path 不得被任何 gateway 行映射（与方法无关，R6）；gateway_excluded 中的 (method, inner_path) 不得被任何 gateway 行映射（methods 为 \"*\" 时与方法无关）"
  - "所有 pattern 满足 regex_dialect（S-20）"

# ---------------------------------------------------------------------------
# 永不经网关放行（计划 §3 末行，凭据面）。WGW-1.0.1（R6）：与方法无关，methods 恒为 "*"（覆盖所有方法，含将来新增的）。
# ---------------------------------------------------------------------------
never_allowed:
  - {inner_path: /api/config, methods: "*", reason: "Telegram api id/hash（凭据面）"}
  - {inner_path: "/api/login/*", methods: "*", reason: "Telegram 登录/2FA（凭据面，D4）"}
  - {inner_path: "/api/login/qr/*", methods: "*", reason: "Telegram 扫码登录（凭据面，D4）"}
  - {inner_path: /, methods: "*", reason: "站点静态入口"}
  - {inner_path: /index.html, methods: "*", reason: "站点静态入口"}
  - {inner_path: /healthz, methods: "*", reason: "容器健康探针，不经网关"}

# 计划明确不对 gateway 开放、但对其他身份存在的端点（methods 为列表时只排除所列方法；"*" 表示所有方法）
gateway_excluded:
  - {inner_path: /api/trading/accounts, methods: [POST], reason: "D7：账号创建含 Binance 密钥，留在站点"}
  - {inner_path: /api/trading/config-snapshot, methods: "*", reason: "§3 P2：不向 app 暴露 snapshot（WGW-1.0.1 起与方法无关）"}
  - {inner_path: "/api/price-alerts/order/{order_id}", methods: [DELETE], reason: "§3 P3：待站点订单身份改造后放行"}
  - {inner_path: /api/messages, methods: [GET], reason: "内存 ring；app 只用 DB 读模型 /api/trading/messages（§5.1）"}

# ---------------------------------------------------------------------------
# 路由表
#   write: null 表示只读。写行字段：
#     operation        审计 operation 名（config_audit.operation）
#     conditional      true = 必须带 expected_revision，不匹配 409 revision_conflict
#     bumps_revision   true = 与业务写同一事务 config_revision+1
#     idempotency      transactional = 查重/校验/业务写/revision/审计同一 SQLite 事务；
#                      reentrant    = 非 SQLite 副作用（JSON 文件、Telegram 连接），可重入，成功以回读状态为准
#   body.field_overrides（可选）：本行某字段改用 body_fields 中另一个定义（仅 br.accounts.post 使用）
#   roles / budget：只对 gateway 行有意义；snapshot 与 browser 行为 null
#   browser 凭据面写行（/api/config、/api/login/*）write 为 null：不进 config_audit、不带 client_ref，站点登录流程不变
# ---------------------------------------------------------------------------
routes:

  # ========================= gateway：P0 =========================
  - id: gw.status.get
    phase: P0
    identity: gateway
    method: GET
    outer_path: /v1/watcher/status
    inner_path: /api/status
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: []
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: null

  # ========================= gateway：P1 =========================
  - id: gw.trading_messages.get
    phase: P1
    identity: gateway
    method: GET
    outer_path: /v1/watcher/trading/messages
    inner_path: /api/trading/messages
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: [channel, hours, limit, before_created_at, before_id]
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: null

  - id: gw.briefings.get
    phase: P1
    identity: gateway
    method: GET
    outer_path: /v1/watcher/trading/briefings
    inner_path: /api/trading/briefings
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: [hours, limit, before_created_at, before_id]
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: null

  - id: gw.media.get
    phase: P1
    identity: gateway
    method: GET
    outer_path: /v1/watcher/media/{filename}
    inner_path: /media/{filename}
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: []
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: media}
    budget: media
    write: null

  - id: gw.media.head
    phase: P1
    identity: gateway
    method: HEAD
    outer_path: /v1/watcher/media/{filename}
    inner_path: /media/{filename}
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: []
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: media}
    budget: media
    write: null

  - id: gw.disconnect.post
    phase: P1
    identity: gateway
    method: POST
    outer_path: /v1/watcher/disconnect
    inner_path: /api/disconnect
    roles: [risk_admin]
    query: []
    body: {allow: [client_ref], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: [client_ref]}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: {operation: telegram.disconnect, conditional: false, bumps_revision: false, idempotency: reentrant}

  - id: gw.reconnect.post
    phase: P1
    identity: gateway
    method: POST
    outer_path: /v1/watcher/reconnect
    inner_path: /api/reconnect
    roles: [risk_admin]
    query: []
    body: {allow: [client_ref], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: [client_ref]}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: {operation: telegram.reconnect, conditional: false, bumps_revision: false, idempotency: reentrant}

  - id: gw.orders.get
    phase: P1
    identity: gateway
    method: GET
    outer_path: /v1/watcher/trading/orders
    inner_path: /api/trading/orders
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: [status, channel]
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: null

  - id: gw.orders_active.get
    phase: P1
    identity: gateway
    method: GET
    outer_path: /v1/watcher/trading/orders/active
    inner_path: /api/trading/orders/active
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: []
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
    response: {omit: [], mask: [], headers: json}
    budget: config
    write: null

  # ========================= gateway：P2 =========================
  - id: gw.dialogs.get
    phase: P2
    identity: gateway
    method: GET
    outer_path: /v1/watcher/dialogs
    inner_path: /api/dialogs
    roles: [system_observer, viewer, risk_admin, reviewer]
    query: []
    body: {allow: [], deny: [api_key, api_secret, apiKey, apiSecret, api_id, api_hash, apiId, apiHash, session, sessionString, password, phoneNumber, phone, code, token], required: []}
