<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#f8f3e7"/>
  <style>
    .title{font:700 40px system-ui;fill:#1f2937}
    .node{fill:#fffdf7;stroke:#111827;stroke-width:3;rx:18}
    .ok{fill:#dcfce7}.warn{fill:#fef3c7}.fail{fill:#fee2e2}.run{fill:#dbeafe}
    .h{font:700 21px system-ui;fill:#111827}.s{font:500 15px system-ui;fill:#374151}
    .line{stroke:#111827;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker></defs>
  <text x="70" y="70" class="title">Signal Lifecycle And Idempotency</text>
  <g transform="translate(70 145)">
    <rect width="190" height="96" class="node run"/><text x="28" y="38" class="h">raw</text><text x="28" y="68" class="s">Telegram message</text>
  </g>
  <g transform="translate(310 145)">
    <rect width="190" height="96" class="node run"/><text x="28" y="38" class="h">parsed</text><text x="28" y="68" class="s">pair, side, SL, TP</text>
  </g>
  <g transform="translate(550 145)">
    <rect width="190" height="96" class="node ok"/><text x="28" y="38" class="h">approved</text><text x="28" y="68" class="s">ready for strategy</text>
  </g>
  <g transform="translate(790 145)">
    <rect width="190" height="96" class="node warn"/><text x="28" y="38" class="h">reserved</text><text x="28" y="68" class="s">one entry only</text>
  </g>
  <g transform="translate(1030 145)">
    <rect width="250" height="96" class="node warn"/><text x="28" y="38" class="h">sent_to_freqtrade</text><text x="28" y="68" class="s">entry emitted</text>
  </g>
  <path d="M260 193 H310" class="line"/><path d="M500 193 H550" class="line"/><path d="M740 193 H790" class="line"/><path d="M980 193 H1030" class="line"/>

  <g transform="translate(250 420)">
    <rect width="220" height="110" class="node ok"/><text x="30" y="42" class="h">entered</text><text x="30" y="72" class="s">order_filled writeback</text>
  </g>
  <g transform="translate(590 420)">
    <rect width="220" height="110" class="node ok"/><text x="30" y="42" class="h">partially_exited</text><text x="30" y="72" class="s">TP / DCA events</text>
  </g>
  <g transform="translate(930 420)">
    <rect width="220" height="110" class="node ok"/><text x="30" y="42" class="h">exited</text><text x="30" y="72" class="s">trade closed</text>
  </g>
  <path d="M1155 241 C1125 330 1040 390 470 475" class="line"/>
  <path d="M470 475 H590" class="line"/><path d="M810 475 H930" class="line"/>

  <g transform="translate(70 625)">
    <rect width="1260" height="80" class="node fail"/>
    <text x="30" y="35" class="h">Failure lanes</text>
    <text x="210" y="35" class="s">needs_review, rejected, expired, failed, ignored, blocked_by_risk</text>
    <text x="30" y="62" class="s">AtomicReservationStore returns duplicate_operation when the same signal tries to enter twice.</text>
  </g>
</svg>
